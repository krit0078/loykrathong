<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ลอยกระทง – Pixel Night</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#120c3a;--panel:rgba(30,18,70,.88);--gold:#f5c542;--ink:#fff4d6;--pink:#ff7db8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Sarabun','Noto Sans Thai',sans-serif;overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;image-rendering:auto}
.panel{background:var(--panel);border:2px solid var(--gold);border-radius:12px;box-shadow:0 0 24px rgba(245,197,66,.25)}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,6,40,.45);z-index:5;padding:12px}
#start .panel{padding:20px 22px;max-width:520px;width:100%;text-align:center}
h1{margin:0 0 2px;font-size:34px;color:var(--gold);text-shadow:0 0 14px rgba(245,197,66,.6)}
.sub{opacity:.8;margin-bottom:14px}
.cards{display:flex;gap:12px;justify-content:center;margin-bottom:12px}
.card{flex:1;border:2px solid #6a5aa8;border-radius:10px;padding:8px;cursor:pointer;background:rgba(255,255,255,.05);color:inherit;font:inherit}
.card.sel{border-color:var(--gold);background:rgba(245,197,66,.15);box-shadow:0 0 14px rgba(245,197,66,.5)}
.card canvas{width:96px;height:120px}
input{font:inherit;color:var(--ink);background:rgba(0,0,0,.35);border:2px solid #6a5aa8;border-radius:8px;padding:8px 10px;width:100%}
input:focus{outline:none;border-color:var(--gold)}
button.go{margin-top:12px;width:100%;font:700 20px 'Sarabun',sans-serif;padding:10px;border:0;border-radius:10px;background:linear-gradient(#ffd86a,#f0a020);color:#3a1a00;cursor:pointer}
.small{font-size:13px;opacity:.75;margin-top:10px}
#hud{position:fixed;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;gap:8px;z-index:3;pointer-events:none}
#hud>*{pointer-events:auto}
.pill{padding:6px 12px;font-size:14px}
button.pill{color:var(--ink);font-family:inherit;cursor:pointer}
#chat{position:fixed;left:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));width:min(420px,calc(100% - 16px));z-index:3}
#log{max-height:130px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;margin-bottom:6px;font-size:14px}
#log div{background:rgba(10,6,40,.7);padding:3px 8px;border-radius:6px;width:fit-content;max-width:100%;word-break:break-word}
#log b{color:var(--gold)}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:3;padding:6px 14px;font-size:14px;display:none}
#stats{position:fixed;right:8px;top:calc(52px + env(safe-area-inset-top,0px));z-index:4;padding:14px;min-width:230px;display:none}
#stats h3{margin:0 0 8px;color:var(--gold)}
#stats div{display:flex;justify-content:space-between;gap:14px;padding:3px 0;border-bottom:1px dashed #5a4a98;font-size:14px}
#pad{position:fixed;left:calc(10px + env(safe-area-inset-left,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:3;display:none;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:4px}
#pad button{border:2px solid var(--gold);background:var(--panel);color:var(--ink);border-radius:12px;font-size:20px;touch-action:none;user-select:none;-webkit-user-select:none}
#pad button:active{background:rgba(245,197,66,.35)}
#pad [data-k=up]{grid-column:2;grid-row:1}#pad [data-k=left]{grid-column:1;grid-row:2}#pad [data-k=down]{grid-column:2;grid-row:2}#pad [data-k=right]{grid-column:3;grid-row:2}
#act{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:3;display:none;width:86px;height:86px;border-radius:50%;border:3px solid var(--gold);background:var(--panel);color:var(--ink);font-size:30px;line-height:1;touch-action:none;opacity:.55}
#act small{display:block;font:700 12px Sarabun,sans-serif}
#act.on{opacity:1;box-shadow:0 0 18px rgba(245,197,66,.7)}
.kps{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.kb{border:2px solid #6a5aa8;background:rgba(255,255,255,.05);border-radius:8px;padding:2px;cursor:pointer}
.kb.sel{border-color:var(--gold);background:rgba(245,197,66,.2)}
.kb canvas{width:44px;height:44px;display:block}
#ktb{display:flex;align-items:center;gap:6px;border:2px solid var(--gold)}#ktb canvas{width:28px;height:28px;display:block}
html,body{touch-action:manipulation;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
input{font-size:16px;-webkit-user-select:text;user-select:text}
#start{overflow-y:auto}#start .panel{margin:auto}
.tc{display:none}
@media (pointer:coarse){#pad{display:grid}#act{display:block}#chat{bottom:calc(130px + env(safe-area-inset-bottom,0px))}#hint{bottom:calc(200px + env(safe-area-inset-bottom,0px))}.pc{display:none}.tc{display:inline}}
@media (pointer:coarse) and (orientation:landscape){#chat{bottom:8px;left:50%;transform:translateX(-50%);width:min(34%,340px)}#log{max-height:64px}#hint{bottom:72px}#start h1{font-size:24px}.sub{margin-bottom:6px}.card canvas{width:64px;height:80px}.kb canvas{width:34px;height:34px}}
@media (orientation:portrait){#wrap{align-items:flex-start;padding-top:calc(50px + env(safe-area-inset-top,0px))}}
#toast{position:fixed;top:30%;left:50%;transform:translateX(-50%);font-size:26px;color:var(--gold);text-shadow:0 0 12px #000;z-index:4;opacity:0;transition:opacity .4s;pointer-events:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>

<div id="start"><div class="panel">
  <h1>🏮 ลอยกระทง 🪷</h1>
  <div class="sub">เกม Pixel Top-Down ยามค่ำคืนวันเพ็ญเดือนสิบสอง</div>
  <div class="cards">
    <button class="card sel" id="gm"><canvas id="pm" width="96" height="120"></canvas><div>ชาย (ไทยย้อนยุค)</div></button>
    <button class="card" id="gf"><canvas id="pf" width="96" height="120"></canvas><div>หญิง (ไทยย้อนยุค)</div></button>
  </div>
  <div class="small" style="margin:0 0 6px">เลือกแบบกระทง</div><div class="kps" id="kps"></div>
  <input id="nm" maxlength="14" placeholder="ชื่อของคุณ" autocomplete="off">
  <button class="go" id="go">▶ เข้าสู่เกม</button>
  <div class="small">เดิน: WASD / ลูกศร · ลอยกระทง: Space · แชท: Enter</div>
</div></div>

<div id="hud" style="display:none">
  <div class="panel pill" id="online">👥 ออนไลน์ 1</div>
  <button class="panel pill" id="ktb" title="เปลี่ยนแบบกระทง (K)"><canvas id="ktc" width="36" height="36"></canvas><span>กระทง</span></button>
  <button class="panel pill" id="sb">📊 สถิติ</button>
</div>
<div id="stats" class="panel"></div>
<div id="hint" class="panel">🪷 <span class="pc">กด Space</span><span class="tc">แตะปุ่ม 🪷</span> เพื่อลอยกระทง</div>
<div id="toast">🙏 ขอพรสำเร็จ</div>
<div id="chat" style="display:none"><div id="log"></div><input id="ci" maxlength="80" placeholder="พิมพ์แชท แล้วกด Enter…" autocomplete="off"></div>
<div id="pad"><button data-k="up">▲</button><button data-k="left">◀</button><button data-k="down">▼</button><button data-k="right">▶</button></div>
<button id="act">🪷<small>ลอยกระทง</small></button>

<script>
const W=960,H=540,P=3;
const cv=document.getElementById('c'),X=cv.getContext('2d');let SC=1;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H),d=Math.min(devicePixelRatio||1,2);cv.style.width=W*s+'px';cv.style.height=H*s+'px';cv.width=Math.round(W*s*d);cv.height=Math.round(H*s*d);SC=s*d}
addEventListener('resize',fit);fit();
const $=id=>document.getElementById(id);
const rnd=i=>{const t=Math.sin(i*127.1)*43758.5453;return t-Math.floor(t)};
const lerp=(a,b,t)=>a+(b-a)*t;

/* ---------- stats (localStorage, per viewer) ---------- */
let S={plays:0,sec:0,steps:0,kt:0,msgs:0,first:Date.now(),last:0};
try{Object.assign(S,JSON.parse(localStorage.getItem('loy_stats')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('loy_stats',JSON.stringify(S))}catch(e){}};
function renderStats(){const m=Math.floor(S.sec/60),s=S.sec%60,f=t=>t?new Date(t).toLocaleString('th-TH'):'-';
$('stats').innerHTML='<h3>📊 สถิติการใช้งาน</h3>';
[['เข้าเกม (ครั้ง)',S.plays],['เวลาเล่นรวม',m+' นาที '+s+' วิ'],['ก้าวเดิน',Math.floor(S.steps)],['กระทงที่ลอย',S.kt],['ข้อความแชท',S.msgs],['เล่นครั้งแรก',f(S.first)]].forEach(([k,v])=>{const d=document.createElement('div'),a=document.createElement('span'),b=document.createElement('b');a.textContent=k;b.textContent=v;d.append(a,b);$('stats').append(d)})}
$('sb').onclick=()=>{const e=$('stats');if(e.style.display=='block')e.style.display='none';else{renderStats();e.style.display='block'}};

/* ---------- sprite (from supplied art) ---------- */

addEventListener('keydown',e=>{if(started&&document.activeElement!=ci&&e.key.toLowerCase()=='k')selKt((me.kv+1)%6)});
/* ---------- start UI ---------- */
function prev(id,g){const c=$(id).getContext('2d');c.clearRect(0,0,96,120);ch(c,48,112,'down',0,g,false,1.25)}
prev('pm','m');prev('pf','f');SP.m.onload=()=>prev('pm','m');SP.f.onload=()=>prev('pf','f');setInterval(()=>{if(!started){prev('pm','m');prev('pf','f')}},500);
$('gm').onclick=()=>{me.g='m';$('gm').classList.add('sel');$('gf').classList.remove('sel')};
$('gf').onclick=()=>{me.g='f';$('gf').classList.add('sel');$('gm').classList.remove('sel')};
$('go').onclick=()=>{me.n=($('nm').value.trim()||(me.g=='m'?'หนุ่มลอยกระทง':'สาวลอยกระทง')).slice(0,14);
  $('start').style.display='none';$('hud').style.display='flex';$('chat').style.display='block';started=true;S.plays++;S.last=Date.now();save();pushPresence(true);log('ระบบ','ยินดีต้อนรับ '+me.n+' สู่ริมน้ำคืนวันเพ็ญ 🌕')};
$('nm').addEventListener('keydown',e=>{if(e.key=='Enter')$('go').click()});

/* ---------- chat ---------- */
function log(n,m){const d=document.createElement('div'),b=document.createElement('b'),s=document.createElement('span');b.textContent=n+': ';s.textContent=m;d.append(b,s);$('log').append(d);while($('log').children.length>6)$('log').firstChild.remove()}
const ci=$('ci');
ci.addEventListener('keydown',e=>{e.stopPropagation();if(e.key=='Enter'){const v=ci.value.trim();ci.value='';ci.blur();if(!v)return;
  me.bub=v;me.bt=6;log(me.n,v);S.msgs++;save();if(room)room.emit('chat',{n:me.n,t:v}).catch(()=>{})}else if(e.key=='Escape')ci.blur()});
addEventListener('keydown',e=>{if(!started||document.activeElement==ci)return;
  if(e.key=='Enter'){ci.focus();e.preventDefault();return}
  if(e.code=='Space'){doFloat();e.preventDefault();return}
  keys[e.key.toLowerCase()]=true});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
document.querySelectorAll('#pad button[data-k]').forEach(b=>{const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{dp[k]=true;e.preventDefault()});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>dp[k]=false))});
$('act').addEventListener('pointerdown',e=>{e.preventDefault();doFloat()});

/* ---------- krathong ---------- */
function spawnKt(x,y,v){if(kts.length>80)kts.shift();kts.push({x,y,vx:12+Math.random()*8,ph:Math.random()*6,life:42,v:v==null?Math.floor(Math.random()*6):v})}
function doFloat(){if(!canFloat())return;const p=onPier(me.x,me.y);const x=p?me.x+(me.x<480?-44:44):me.x,y=p?me.y-4:316;
  spawnKt(x,y,me.kv);S.kt++;save();if(room)room.emit('kt',{x,y,v:me.kv}).catch(()=>{});
  const T=$('toast');T.style.opacity=1;setTimeout(()=>T.style.opacity=0,1400)}

/* ---------- multiplayer (room) ---------- */
let lastP='';
function pushPresence(force){if(!room||!started)return;const o={x:Math.round(me.x),y:Math.round(me.y),d:me.d,f:Math.floor(me.f),g:me.g,n:me.n,mv:me.mv},j=JSON.stringify(o);if(j!=lastP||force){lastP=j;room.presence(o).catch(()=>{})}}
setInterval(()=>pushPresence(),120);
(async()=>{try{room=await claude.use('room');if(!room)return;
  room.onPeers(ch=>{const ids={};ch.peers.forEach(p=>{if(p.isMe||!p.presence||p.presence.x==null)return;ids[p.peer]=1;const q=peers[p.peer]||(peers[p.peer]={x:p.presence.x,y:p.presence.y,bub:'',bt:0});Object.assign(q,{tx:p.presence.x,ty:p.presence.y,d:p.presence.d,f:p.presence.f,g:p.presence.g,n:p.presence.n,mv:p.presence.mv})});
    for(const k in peers)if(!ids[k])delete peers[k];$('online').textContent='👥 ออนไลน์ '+(Object.keys(ids).length+1)});
  room.on('chat',m=>{if(m.isMe||!m.data)return;const n=String(m.data.n||'ผู้เล่น').slice(0,14),tx=String(m.data.t||'').slice(0,80);log(n,tx);const q=peers[m.peer];if(q){q.bub=tx;q.bt=6}});
  room.on('kt',m=>{if(m.isMe||!m.data)return;spawnKt(+m.data.x||300,+m.data.y||300,Math.min(5,Math.max(0,Math.floor(+m.data.v||0))))});
  pushPresence(true)}catch(e){}})();

function glow(x,y,r,a){const g=X.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(255,190,80,'+a+')');g.addColorStop(1,'rgba(255,190,80,0)');X.fillStyle=g;X.fillRect(x-r,y-r,r*2,r*2)}
function lanternPost(x,y){X.fillStyle='#5a3a1a';X.fillRect(x-2,y-60,4,60);X.fillRect(x-2,y-62,22,3);glow(x+16,y-48,50,.55+.1*Math.sin(t*5+x));X.fillStyle='#ffb040';X.fillRect(x+10,y-58,12,18);X.fillStyle='#ffe08a';X.fillRect(x+12,y-55,8,12);X.fillStyle='#d99a20';X.fillRect(x+9,y-60,14,3);X.fillRect(x+9,y-40,14,3)}
function tree(x,y,pink){X.fillStyle='rgba(0,0,0,.35)';X.beginPath();X.ellipse(x,y+2,46,12,0,0,7);X.fill();X.fillStyle='#4a2f18';X.fillRect(x-7,y-50,14,52);X.fillStyle='#331f10';X.fillRect(x-7,y-50,4,52);
  const c1=pink?'#d2589a':'#1f6a2a',c2=pink?'#f08cc0':'#2f8a3a',c3=pink?'#ffc4e0':'#4cae52';
  [[x,y-86,44,c1],[x-28,y-66,32,c1],[x+28,y-66,32,c1],[x-4,y-92,34,c2],[x+14,y-100,22,c3],[x-20,y-76,18,c3]].forEach(a=>{X.fillStyle=a[3];X.beginPath();X.arc(a[0],a[1],a[2],0,7);X.fill()})}
function stall(x,y){X.fillStyle='rgba(0,0,0,.35)';X.fillRect(x-48,y,100,10);X.fillStyle='#6a4220';X.fillRect(x-42,y-42,84,44);X.fillStyle='#3a2410';X.fillRect(x-42,y-4,84,6);
  for(let i=0;i<7;i++){X.fillStyle=i%2?'#fff':'#d94040';X.fillRect(x-48+i*14,y-70,14,22)}
  [-34,-12,10,32].forEach((o,i)=>{glow(x+o,y-44,22,.5);X.fillStyle='#ffd070';X.fillRect(x+o-3,y-48,6,6)});
  X.fillStyle='#ff7db8';[-30,-14,2,18].forEach(o=>{X.beginPath();X.arc(x+o,y-14,7,0,7);X.fill()});X.fillStyle='#2f7a3a';[-30,-14,2,18].forEach(o=>X.fillRect(x+o-7,y-8,14,4))}
function bush(x,y,s){X.fillStyle='#1c5a28';X.beginPath();X.arc(x,y,16*s,0,7);X.arc(x+14*s,y+3,13*s,0,7);X.arc(x-14*s,y+3,12*s,0,7);X.fill();X.fillStyle='#3a9a44';X.beginPath();X.arc(x-2,y-5*s,8*s,0,7);X.fill()}
function drawKt(k){const a=Math.min(1,k.life/5),y=k.y+Math.sin(t*2+k.ph)*1.5,w=58;if(!KI.complete)return;X.globalAlpha=a;
  X.fillStyle='rgba(255,190,80,.2)';X.beginPath();X.ellipse(k.x,y+12,24,5,0,0,7);X.fill();
  X.drawImage(KI,k.v*124,0,124,124,k.x-w/2,y+14-w,w,w);
  glow(k.x,y-14,28,.5+.12*Math.sin(t*14+k.ph));X.globalAlpha=1}
function bubble(txt,x,y){X.font='700 13px Sarabun,sans-serif';const w=Math.min(190,X.measureText(txt).width+16);let s=txt;while(X.measureText(s).width>174&&s.length>1)s=s.slice(0,-1);if(s!=txt)s+='…';
  X.fillStyle='rgba(255,255,255,.95)';X.beginPath();X.roundRect(x-w/2,y-22,w,22,8);X.fill();X.beginPath();X.moveTo(x-5,y);X.lineTo(x,y+7);X.lineTo(x+5,y);X.fill();X.fillStyle='#2a1850';X.textAlign='center';X.fillText(s,x,y-7)}
function person(p,isMe){const s=.8+p.y/H*.45;ch(X,p.x,p.y,p.d||'down',p.f||0,p.g||'m',p.mv,s);
  X.font='700 12px Sarabun,sans-serif';X.textAlign='center';X.fillStyle='rgba(0,0,0,.6)';X.fillText(p.n||'',p.x+1,p.y-84*s+1);X.fillStyle=isMe?'#ffe27a':'#fff';X.fillText(p.n||'',p.x,p.y-84*s)}
function fireworks(dt){if(Math.random()<dt/3.5){const x=100+Math.random()*760,y=30+Math.random()*90,c=['#ffd23a','#ff7db8','#7ad0ff','#b88aff'][Math.floor(Math.random()*4)];for(let i=0;i<46;i++){const a=i/46*6.283,v=50+Math.random()*40;fws.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1.6,c})}}
  for(let i=fws.length-1;i>=0;i--){const f=fws[i];f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=30*dt;f.vx*=.985;f.l-=dt;if(f.l<=0){fws.splice(i,1);continue}X.globalAlpha=Math.min(1,f.l);X.fillStyle=f.c;X.fillRect(f.x,f.y,3,3)}X.globalAlpha=1}
function lantsUpd(dt){if(Math.random()<dt/1.2&&lants.length<14)lants.push({x:Math.random()*W,y:200+Math.random()*60,s:.5+Math.random(),ph:Math.random()*6});
  for(let i=lants.length-1;i>=0;i--){const l=lants[i];l.y-=14*l.s*dt;l.x+=Math.sin(t+l.ph)*8*dt;if(l.y<-20){lants.splice(i,1);continue}
    const a=Math.min(1,(l.y+20)/80,(260-l.y)/40);X.globalAlpha=Math.max(0,a);glow(l.x,l.y,28*l.s,.7);X.fillStyle='#ff9a30';X.fillRect(l.x-5*l.s,l.y-6*l.s,10*l.s,12*l.s);X.fillStyle='#ffe08a';X.fillRect(l.x-3*l.s,l.y-3*l.s,6*l.s,6*l.s)}X.globalAlpha=1}

/* ---------- loop ---------- */
let prevT=performance.now(),acc=0;
function loop(now){const dt=Math.min(.05,(now-prevT)/1000);prevT=now;t+=dt;
  if(started){let dx=0,dy=0;if(keys.a||keys.arrowleft||dp.left)dx--;if(keys.d||keys.arrowright||dp.right)dx++;if(keys.w||keys.arrowup||dp.up)dy--;if(keys.s||keys.arrowdown||dp.down)dy++;
    me.mv=!!(dx||dy);if(me.mv){const l=Math.hypot(dx,dy),sp=115*dt;let nx=me.x+dx/l*sp,ny=me.y+dy/l*sp;nx=Math.max(24,Math.min(W-24,nx));
      const lim=onPier(nx,ny)||onPier(me.x,me.y)&&nx>452&&nx<508?250:342;ny=Math.max(lim,Math.min(H-8,ny));
      if(me.y<342&&!onPier(nx,ny))ny=Math.max(ny,me.y<342?me.y:342);
      S.steps+=Math.hypot(nx-me.x,ny-me.y)/12;me.x=nx;me.y=ny;me.f+=dt*8;me.d=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down')}
    if(me.bt>0)me.bt-=dt;acc+=dt;if(acc>=1){acc-=1;S.sec++;if(S.sec%5==0)save()}
    const cf=canFloat();$('hint').style.display=cf?'block':'none';$('act').classList.toggle('on',cf)}
  X.setTransform(SC,0,0,SC,0,0);X.clearRect(0,0,W,H);
  sky();farBank();water();land();fireworks(dt);lantsUpd(dt);
  for(let i=kts.length-1;i>=0;i--){const k=kts[i];k.x+=k.vx*dt;k.life-=dt;k.y+=Math.sin(t+k.ph)*2*dt;if(k.life<=0||k.x>W+20)kts.splice(i,1)}
  kts.forEach(drawKt);
  const ents=[];
  [[90,388,'t'],[866,376,'p'],[400,520,'b'],[700,525,'b'],[30,470,'t'],[930,480,'t']].forEach(a=>ents.push({y:a[1],f:()=>a[2]=='t'?tree(a[0],a[1]):a[2]=='p'?tree(a[0],a[1],1):bush(a[0],a[1],1.3)}));
  ents.push({y:458,f:()=>stall(195,458)});ents.push({y:360,f:()=>lanternPost(300,360)});ents.push({y:360,f:()=>lanternPost(640,360)});ents.push({y:345,f:()=>lanternPost(430,345)});
  for(const id in peers){const q=peers[id];if(q.tx==null)continue;q.x=lerp(q.x,q.tx,.2);q.y=lerp(q.y,q.ty,.2);if(q.bt>0)q.bt-=dt;ents.push({y:q.y,f:()=>{person(q,false);if(q.bt>0&&q.bub)bubble(q.bub,q.x,q.y-104*(.8+q.y/H*.45))}})}
  ents.push({y:me.y,f:()=>{person(me,true);if(me.bt>0&&me.bub)bubble(me.bub,me.x,me.y-104*(.8+me.y/H*.45))}});
  ents.sort((a,b)=>a.y-b.y).forEach(e=>e.f());
  const v=X.createRadialGradient(W/2,H/2,H*.45,W/2,H/2,H*.95);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(5,2,25,.55)');X.fillStyle=v;X.fillRect(0,0,W,H);
  requestAnimationFrame(loop)}
requestAnimationFrame(loop);
// demo: attract-mode krathongs on the start screen
for(let i=0;i<5;i++)spawnKt(80+i*170,250+(i%2)*40);
setInterval(()=>{if(!started)spawnKt(-10,230+Math.random()*80)},2500);
